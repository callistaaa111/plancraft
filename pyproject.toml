# Tooling configuration for PlanCraft. The app itself is a plain script folder (no install step), so this file
# configures linting, coverage and the test/build commands used locally and in CI.
# Version: version.py. Python: >=3.10 (see README).

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data", "dist", "build", ".venv", "packaging"]

[tool.ruff.lint]
# Start with correctness and import hygiene; add stricter rules deliberately.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are mostly UI strings and test fixtures; keep line-length for the formatter only
]

[tool.ruff.lint.isort]
known-first-party = ["importers", "measure", "printpdf", "pricelist", "pricing", "store", "tasks", "vision", "version"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "packaging/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

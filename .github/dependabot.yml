version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        # Majors come as their own PRs so one breaking bump cannot hide inside the group.
        update-types: ["minor", "patch"]
    ignore:
      # 2.x pulls the optional layout/LLM stack (onnxruntime, ~250 MB) that PlanCraft does not use.
      # Stay on the 1.x ABI build; review this deliberately before ever allowing a major bump.
      # An explicit version range: the semver-major rule alone let #11 widen the pin to >=2.0.
      - dependency-name: "pymupdf"
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
